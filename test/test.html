<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <title>FUGU Card</title>
    <style>
      body {
        background: #111;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        font-family: Arial, sans-serif;
      }

      .card {
        width: 320px;
        background: #e9e9e9;
        border-radius: 16px;
        overflow: hidden;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      }

      .header {
        background: #ffd400;
        padding: 12px;
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .logo {
        width: 50px;
        height: 50px;
        border-radius: 10px;
        background: url("https://via.placeholder.com/50") center/cover;
      }

      .title {
        font-weight: bold;
        font-size: 18px;
      }

      .rating {
        font-size: 14px;
      }

      .bonus {
        background: #000;
        color: #ffd400;
        text-align: center;
        padding: 15px;
        font-weight: bold;
        font-size: 18px;
      }

      .content {
        padding: 15px;
      }

      .slots {
        font-weight: bold;
        font-size: 14px;
        margin-bottom: 5px;
      }

      .progress {
        height: 10px;
        background: #ccc;
        border-radius: 2px;
        overflow: hidden;
        margin-bottom: 15px;
      }

      .progress-bar {
        width: 85%;
        height: 100%;
        background: red;
      }

      .payments {
        display: flex;
        flex-wrap: wrap;
        gap: 5px;
        margin-bottom: 15px;
      }

      .pay {
        border: 2px solid #000;
        padding: 5px 8px;
        font-size: 12px;
        background: #fff;
      }

      .features {
        margin-bottom: 15px;
      }

      .feature {
        display: flex;
        align-items: center;
        margin-bottom: 8px;
        font-size: 14px;
      }

      .check {
        width: 20px;
        height: 20px;
        border-radius: 50%;
        background: #ffd400;
        display: flex;
        justify-content: center;
        align-items: center;
        margin-right: 8px;
        font-weight: bold;
      }

      .btn {
        background: #ffd400;
        text-align: center;
        padding: 15px;
        font-weight: bold;
        font-size: 18px;
        border: 3px solid #000;
        cursor: pointer;
        box-shadow: 3px 3px 0 #000;
      }

      .login {
        text-align: center;
        font-size: 12px;
        margin-top: 10px;
      }

      .icons {
        display: flex;
        justify-content: center;
        gap: 10px;
        margin-top: 5px;
      }

      .icon {
        width: 35px;
        height: 35px;
        background: #fff;
        border: 2px solid #000;
        display: flex;
        justify-content: center;
        align-items: center;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="header">
        <div class="logo"></div>
        <div>
          <div class="title">FUGU</div>
          <div class="rating">★★★★★ 4.9 • 1883 онлайн</div>
        </div>
      </div>

      <div class="bonus">700 FS + 250% БОНУС</div>

      <div class="content">
        <div class="slots">ОСТАЛОСЬ МЕСТ: 8 ИЗ 100</div>

        <div class="progress">
          <div class="progress-bar"></div>
        </div>

        <div class="payments">
          <div class="pay">СБП</div>
          <div class="pay">MIR</div>
          <div class="pay">VISA</div>
          <div class="pay">MC</div>
          <div class="pay">CRYPTO</div>
          <div class="pay">PIASTRIX</div>
        </div>

        <div class="features">
          <div class="feature">
            <div class="check">✓</div>
            Безлимит на вывод
          </div>
          <div class="feature">
            <div class="check">✓</div>
            Высокий RTP
          </div>
          <div class="feature">
            <div class="check">✓</div>
            Ежедневный рейкбек
          </div>
        </div>

        <div class="btn">ПОЛУЧИТЬ</div>

        <div class="login">
          ВХОД В 1 КЛИК:
          <div class="icons">
            <div class="icon">TG</div>
            <div class="icon">G</div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
